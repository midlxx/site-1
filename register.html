<!DOCTYPE html>
<html>
<head>
  <title>Регистрация</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>Регистрация нового пользователя</h1>
    
    <div class="form-group">
      <input type="text" id="regUsername" placeholder="Логин" required>
    </div>
    <div class="form-group">
      <input type="password" id="regPassword" placeholder="Пароль" required>
    </div>
    <div class="form-group">
      <input type="password" id="confirmPassword" placeholder="Подтвердите пароль" required>
    </div>
    <button onclick="register(event)">Зарегистрироваться</button>
    
    <div style="margin-top: 20px;">
      <a href="index.html">Назад к входу</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
